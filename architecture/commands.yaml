# commands — subcommand implementations
# Source: src/commands

modules:
  - id: init
    file: init.rs
    owns: [project-scaffolding, template-generation, directory-scanning, deep-inference, project-reference-parsing, naming-classification]
    boundary: "Scaffolding only — uses scanner for detection, schema for types"
    depends_on: [scanner/scanner, schema/schema]

  - id: validate
    file: validate.rs
    owns: [yaml-integrity, cross-ref-validation, file-existence-checks]
    boundary: "Read-only validation — never modifies files"
    depends_on: [context/context]

  - id: coverage
    file: coverage.rs
    owns: [unmapped-file-detection, source-file-walking]
    boundary: "Read-only analysis — walks filesystem, compares to YAML"
    depends_on: [context/context]

  - id: owns
    file: owns.rs
    owns: [concept-lookup, module-search, ownership-queries]
    boundary: "Read-only query — searches owns fields, module ids, file names"
    depends_on: [context/context]

  - id: stale
    file: stale.rs
    owns: [architecture-health-check, combined-validation]
    boundary: "Composite command — delegates to validate and coverage, no own logic beyond combining results"
    depends_on: [commands/validate, commands/coverage, context/context]

  - id: drift
    file: drift.rs
    owns: [dependency-drift-detection, undeclared-dependency-detection]
    boundary: "Read-only analysis — scans source imports vs declared depends_on"
    depends_on: [context/context, imports/imports, resolve/resolve]

  - id: fitness
    file: fitness.rs
    owns: [rule-validation, no-dependency-enforcement, boundary-rule-reporting]
    boundary: "Read-only analysis — evaluates architecture rules against actual imports"
    depends_on: [context/context, imports/imports, resolve/resolve]

  - id: stories
    file: stories.rs
    owns: [story-flow-verification, bidirectional-connection-check, dependency-graph-building]
    boundary: "Read-only analysis — verifies story flows against actual imports"
    depends_on: [context/context, imports/imports, resolve/resolve]

  - id: mod
    file: mod.rs
    owns: [command-module-exports]
    boundary: "Re-exports only"
    depends_on: []

  - id: mermaid
    file: mermaid.rs
    owns: [diagram-generation, container-diagrams, story-flowcharts]
    boundary: "Read-only — generates Mermaid text from YAML, never modifies files"
    depends_on: [context/context]
