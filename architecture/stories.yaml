# Cross-cutting flows connecting modules across containers.

stories:
  - id: user-runs-init
    description: User scaffolds architecture YAML for a new project
    flow:
      - cli/cli           # parses `arch init` args
      - scanner/scanner   # detects project type (Rust/JS/.NET/etc)
      - commands/init     # scans dirs, generates YAML files

  - id: user-validates
    description: User checks YAML integrity after edits
    flow:
      - cli/cli           # parses `arch validate`
      - commands/validate  # loads root + container YAMLs, checks refs and files

  - id: user-queries-ownership
    description: User finds which module owns a concept before editing
    flow:
      - cli/cli           # parses `arch owns <concept>`
      - commands/owns     # searches owns fields, module ids, file names

  - id: user-checks-coverage
    description: User finds unmapped source files
    flow:
      - cli/cli           # parses `arch coverage`
      - commands/coverage  # walks source dirs, compares to mapped files

  - id: user-checks-staleness
    description: User checks overall architecture health (validate + coverage combined)
    flow:
      - cli/cli            # parses `arch stale`
      - commands/stale     # delegates to validate and coverage, combines results

  - id: user-checks-drift
    description: User detects undeclared or forbidden dependencies by scanning source imports
    flow:
      - cli/cli            # parses `arch drift`
      - commands/drift     # builds ModuleIndex (resolve), extracts imports, compares against declared deps

  - id: user-checks-fitness
    description: User validates architectural rules against actual code
    flow:
      - cli/cli            # parses `arch fitness`
      - commands/fitness   # extracts imports, evaluates no_dependency and boundary rules

  - id: user-checks-stories
    description: User verifies that story flows are backed by real import connections
    flow:
      - cli/cli            # parses `arch stories`
      - commands/stories   # builds dep graph (resolve + imports), checks consecutive flow pairs
